<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💕 Heart Catcher</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Comic Sans MS", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #d9c7ff, #bdefff);
      color: #713b60;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Top scoreboard */
    #hud {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;

      width: min(92%, 600px);
      padding: 14px 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(255, 255, 255, 0.75);
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(100, 50, 100, 0.15);
    }

    #title {
      font-size: 20px;
      font-weight: bold;
    }

    #stats {
      display: flex;
      gap: 15px;
      font-weight: bold;
    }

    /* Hearts */
    .heart {
      position: absolute;
      z-index: 10;

      width: 55px;
      height: 55px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 45px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition: transform 0.1s;
    }

    .heart:hover {
      transform: scale(1.2);
    }

    .heart:active {
      transform: scale(0.8);
    }

    /* Score animation */
    .plus {
      position: absolute;
      z-index: 50;

      color: #ff4f91;
      font-size: 25px;
      font-weight: bold;

      pointer-events: none;

      animation: popUp 0.6s ease-out forwards;
    }

    @keyframes popUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-60px) scale(1.4);
      }
    }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      z-index: 200;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(255, 220, 238, 0.65);
      backdrop-filter: blur(8px);
    }

    .box {
      width: min(90%, 400px);
      padding: 35px 25px;

      text-align: center;

      background: white;
      border-radius: 35px;

      box-shadow: 0 20px 60px rgba(100, 50, 100, 0.2);
    }

    .box h1 {
      margin-top: 0;
      color: #ff5796;
      font-size: 38px;
    }

    .box p {
      line-height: 1.6;
      font-size: 17px;
    }

    button {
      border: 0;
      padding: 15px 30px;

      border-radius: 50px;

      background: linear-gradient(135deg, #ff6fa8, #9c6cff);
      color: white;

      font-family: inherit;
      font-size: 18px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 8px 20px rgba(180, 80, 140, 0.3);
    }

    button:hover {
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    /* Cute background decorations */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }

    .bubble1 {
      width: 100px;
      height: 100px;
      left: 10%;
      top: 30%;
    }

    .bubble2 {
      width: 150px;
      height: 150px;
      right: 5%;
      bottom: 15%;
    }

    .bubble3 {
      width: 60px;
      height: 60px;
      right: 25%;
      top: 20%;
    }

    @media (max-width: 500px) {
      #title {
        font-size: 16px;
      }

      #stats {
        gap: 7px;
        font-size: 13px;
      }

      .heart {
        width: 50px;
        height: 50px;
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <!-- Background -->
  <div class="bubble bubble1"></div>
  <div class="bubble bubble2"></div>
  <div class="bubble bubble3"></div>

  <!-- Score -->
  <div id="hud">
    <div id="title">💕 Heart Catcher</div>

    <div id="stats">
      <span>⭐ <span id="score">0</span></span>
      <span>❤️ <span id="lives">3</span></span>
      <span>⏱️ <span id="time">30</span></span>
    </div>
  </div>

  <!-- Start screen -->
  <div id="startScreen" class="screen">
    <div class="box">
      <h1>💕 Heart Catcher</h1>

      <p>
        Catch the falling hearts before they reach
        the bottom! 🥰
      </p>

      <p>
        You have <b>3 lives</b> and <b>30 seconds</b>.
      </p>

      <button id="startButton">
        Start Game ✨
      </button>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameOver" class="screen hidden">
    <div class="box">
      <h1>Game Over 💗</h1>

      <p>
        You caught
        <b><span id="finalScore">0</span></b>
        hearts!
      </p>

      <button id="restartButton">
        Play Again 🔄
      </button>
    </div>
  </div>

</div>


<script>
  // =========================
  // GAME VARIABLES
  // =========================

  const game = document.getElementById("game");

  const scoreElement = document.getElementById("score");
  const livesElement = document.getElementById("lives");
  const timeElement = document.getElementById("time");

  const startScreen = document.getElementById("startScreen");
  const gameOverScreen = document.getElementById("gameOver");

  const startButton = document.getElementById("startButton");
  const restartButton = document.getElementById("restartButton");

  const finalScore = document.getElementById("finalScore");


  let score = 0;
  let lives = 3;
  let time = 30;

  let playing = false;

  let spawnTimer = null;
  let clockTimer = null;


  const heartTypes = [
    "💗",
    "💖",
    "💕",
    "💓",
    "💘",
    "💝",
    "🩷",
    "❤️"
  ];


  // =========================
  // START GAME
  // =========================

  function startGame() {

    // Stop old timers
    clearInterval(spawnTimer);
    clearInterval(clockTimer);

    // Remove old hearts
    document.querySelectorAll(".heart").forEach(function(heart) {
      heart.remove();
    });

    // Reset values
    score = 0;
    lives = 3;
    time = 30;

    playing = true;

    updateHUD();

    // Hide screens
    startScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");

    // Create hearts regularly
    spawnTimer = setInterval(function() {
      createHeart();
    }, 650);

    // Countdown
    clockTimer = setInterval(function() {

      if (!playing) {
        return;
      }

      time--;

      updateHUD();

      if (time <= 0) {
        endGame();
      }

    }, 1000);
  }


  // =========================
  // CREATE HEART
  // =========================

  function createHeart() {

    if (!playing) {
      return;
    }

    const heart = document.createElement("div");

    heart.className = "heart";

    // Random heart
    const randomIndex =
      Math.floor(Math.random() * heartTypes.length);

    heart.textContent = heartTypes[randomIndex];


    // Random horizontal position
    const maxX = window.innerWidth - 60;

    const x =
      Math.max(10, Math.random() * maxX);


    heart.style.left = x + "px";
    heart.style.top = "-70px";


    // Add heart to game
    game.appendChild(heart);


    // IMPORTANT:
    // This makes the heart clickable/tappable.
    heart.addEventListener("pointerdown", function(event) {

      event.preventDefault();

      catchHeart(heart);

    });


    // Start falling
    fallHeart(heart);
  }


  // =========================
  // FALLING HEART
  // =========================

  function fallHeart(heart) {

    let y = -70;

    // Speed increases as time passes
    const speed =
      2 + Math.random() * 2 + (30 - time) * 0.05;


    function move() {

      // Stop if game ended
      if (!playing) {
        return;
      }

      // Heart may have already been caught
      if (!heart.isConnected) {
        return;
      }


      y += speed;

      heart.style.top = y + "px";


      // Heart reached bottom
      if (y > window.innerHeight) {

        heart.remove();

        loseLife();

        return;
      }


      requestAnimationFrame(move);
    }


    requestAnimationFrame(move);
  }


  // =========================
  // CATCH HEART
  // =========================

  function catchHeart(heart) {

    // Prevent double clicking
    if (!playing || !heart.isConnected) {
      return;
    }

    // Get position before removing
    const rect = heart.getBoundingClientRect();


    // Increase score
    score++;

    updateHUD();


    // Show +1 animation
    showPoints(
      rect.left,
      rect.top
    );


    // Remove heart
    heart.remove();
  }


  // =========================
  // LOSE LIFE
  // =========================

  function loseLife() {

    if (!playing) {
      return;
    }

    lives--;

    updateHUD();


    if (lives <= 0) {
      endGame();
    }
  }


  // =========================
  // +1 ANIMATION
  // =========================

  function showPoints(x, y) {

    const points = document.createElement("div");

    points.className = "plus";

    points.textContent = "+1 💕";

    points.style.left = x + "px";
    points.style.top = y + "px";

    game.appendChild(points);


    setTimeout(function() {
      points.remove();
    }, 600);
  }


  // =========================
  // UPDATE SCORE
  // =========================

  function updateHUD() {

    scoreElement.textContent = score;
    livesElement.textContent = lives;
    timeElement.textContent = time;
  }


  // =========================
  // END GAME
  // =========================

  function endGame() {

    if (!playing) {
      return;
    }

    playing = false;


    // Stop timers
    clearInterval(spawnTimer);
    clearInterval(clockTimer);


    // Remove all hearts
    document.querySelectorAll(".heart").forEach(function(heart) {
      heart.remove();
    });


    // Show final score
    finalScore.textContent = score;

    gameOverScreen.classList.remove("hidden");
  }


  // =========================
  // BUTTONS
  // =========================

  startButton.addEventListener("click", function() {
    startGame();
  });


  restartButton.addEventListener("click", function() {
    startGame();
  });

</script>

</body>
</html>
