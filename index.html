<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Catcher 💕</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Comic Sans MS", cursive, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #ffd6e7, #d9c7ff, #bdefff);
    color: #6b3157;
  }

  .game {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* Background bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.35);
    animation: float 6s infinite ease-in-out;
  }

  .b1 {
    width: 80px;
    height: 80px;
    left: 10%;
    top: 20%;
  }

  .b2 {
    width: 130px;
    height: 130px;
    right: 8%;
    top: 35%;
    animation-delay: 1s;
  }

  .b3 {
    width: 50px;
    height: 50px;
    left: 70%;
    top: 15%;
    animation-delay: 2s;
  }

  @keyframes float {
    50% {
      transform: translateY(-30px);
    }
  }

  .top {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: min(90%, 650px);

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 20px;
    border-radius: 25px;

    background: rgba(255,255,255,.6);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(150,80,120,.15);

    z-index: 10;
  }

  .title {
    font-size: 1.5rem;
    font-weight: bold;
  }

  .stats {
    display: flex;
    gap: 18px;
    font-size: 1rem;
  }

  .game-area {
    position: absolute;
    inset: 0;
  }

  .heart {
    position: absolute;
    font-size: 45px;
    cursor: pointer;
    user-select: none;

    filter: drop-shadow(0 5px 5px rgba(120,50,100,.2));

    animation: wobble .7s infinite alternate;
  }

  @keyframes wobble {
    from {
      transform: rotate(-8deg) scale(1);
    }
    to {
      transform: rotate(8deg) scale(1.08);
    }
  }

  .pop {
    position: absolute;
    pointer-events: none;
    font-size: 25px;
    animation: pop .5s forwards;
  }

  @keyframes pop {
    0% {
      opacity: 1;
      transform: scale(.5);
    }

    100% {
      opacity: 0;
      transform: translateY(-60px) scale(1.5);
    }
  }

  .start-screen,
  .game-over {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(255,220,238,.65);
    backdrop-filter: blur(8px);

    z-index: 20;
  }

  .panel {
    width: min(90%, 400px);
    text-align: center;
    padding: 40px 25px;

    background: white;
    border-radius: 35px;

    box-shadow: 0 20px 60px rgba(130,70,110,.25);
  }

  .panel h1 {
    font-size: 2.5rem;
    color: #ff5c9a;
    margin-bottom: 10px;
  }

  .panel p {
    margin: 10px 0 25px;
    line-height: 1.6;
  }

  button {
    border: none;
    padding: 15px 30px;
    border-radius: 50px;

    background: linear-gradient(135deg, #ff76aa, #a978ff);
    color: white;

    font-family: inherit;
    font-size: 1.1rem;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 20px rgba(200,90,150,.3);
    transition: .2s;
  }

  button:hover {
    transform: translateY(-3px) scale(1.05);
  }

  .hidden {
    display: none;
  }

  .instructions {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 15px;
    border-radius: 20px;

    background: rgba(255,255,255,.45);
    font-size: .9rem;
  }

  @media (max-width: 500px) {
    .top {
      font-size: .85rem;
    }

    .title {
      font-size: 1.1rem;
    }

    .stats {
      gap: 8px;
    }

    .heart {
      font-size: 38px;
    }
  }
</style>
</head>

<body>

<div class="game">

  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>

  <div class="top">
    <div class="title">💕 Heart Catcher</div>

    <div class="stats">
      <div>⭐ <span id="score">0</span></div>
      <div>❤️ <span id="lives">3</span></div>
      <div>⏱️ <span id="time">30</span></div>
    </div>
  </div>

  <div id="gameArea" class="game-area"></div>

  <div class="instructions">
    Click the hearts before they disappear! 💖
  </div>

  <!-- Start -->
  <div id="startScreen" class="start-screen">
    <div class="panel">
      <h1>💗 Heart Catcher</h1>

      <p>
        Catch as many cute hearts as you can!
        Don't let them escape. 🥺
      </p>

      <button onclick="startGame()">
        Start Game ✨
      </button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="gameOver" class="game-over hidden">
    <div class="panel">
      <h1>Game Over 💕</h1>

      <p>
        You caught <strong><span id="finalScore">0</span></strong>
        hearts! 🌸
      </p>

      <button onclick="startGame()">
        Play Again 🔄
      </button>
    </div>
  </div>

</div>

<script>
  const gameArea = document.getElementById("gameArea");
  const scoreText = document.getElementById("score");
  const livesText = document.getElementById("lives");
  const timeText = document.getElementById("time");
  const startScreen = document.getElementById("startScreen");
  const gameOver = document.getElementById("gameOver");
  const finalScore = document.getElementById("finalScore");

  let score = 0;
  let lives = 3;
  let time = 30;
  let playing = false;

  let heartTimer;
  let clockTimer;

  const hearts = [
    "💗",
    "💖",
    "💕",
    "💓",
    "💘",
    "💝",
    "❤️",
    "🩷"
  ];

  function startGame() {
    score = 0;
    lives = 3;
    time = 30;
    playing = true;

    scoreText.textContent = score;
    livesText.textContent = lives;
    timeText.textContent = time;

    startScreen.classList.add("hidden");
    gameOver.classList.add("hidden");

    gameArea.innerHTML = "";

    clearInterval(heartTimer);
    clearInterval(clockTimer);

    heartTimer = setInterval(createHeart, 700);

    clockTimer = setInterval(() => {
      time--;

      timeText.textContent = time;

      if (time <= 0) {
        endGame();
      }
    }, 1000);
  }

  function createHeart() {
    if (!playing) return;

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent =
      hearts[Math.floor(Math.random() * hearts.length)];

    const maxX = window.innerWidth - 60;
    const x = Math.random() * maxX;

    heart.style.left = x + "px";
    heart.style.top = "-60px";

    gameArea.appendChild(heart);

    let y = -60;

    const speed =
      1.5 +
      Math.random() * 2 +
      (30 - time) * 0.04;

    const fall = setInterval(() => {
      if (!playing) {
        clearInterval(fall);
        return;
      }

      y += speed;
      heart.style.top = y + "px";

      if (y > window.innerHeight) {
        clearInterval(fall);

        if (heart.parentElement) {
          heart.remove();
          loseLife();
        }
      }
    }, 16);

    heart.addEventListener("click", () => {
      if (!playing) return;

      clearInterval(fall);

      score++;
      scoreText.textContent = score;

      showPop(
        heart.offsetLeft,
        heart.offsetTop
      );

      heart.remove();
    });
  }

  function loseLife() {
    lives--;

    livesText.textContent = lives;

    if (lives <= 0) {
      endGame();
    }
  }

  function showPop(x, y) {
    const pop = document.createElement("div");

    pop.className = "pop";
    pop.textContent = "+1 💕";

    pop.style.left = x + "px";
    pop.style.top = y + "px";

    gameArea.appendChild(pop);

    setTimeout(() => {
      pop.remove();
    }, 500);
  }

  function endGame() {
    playing = false;

    clearInterval(heartTimer);
    clearInterval(clockTimer);

    document.querySelectorAll(".heart").forEach(h => h.remove());

    finalScore.textContent = score;

    gameOver.classList.remove("hidden");
  }
</script>

</body>
</html>
